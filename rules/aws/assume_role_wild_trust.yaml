id: AWS-TRUST-001
title: Wildcard assume-role trust without org and MFA guards
description: Detect admin role trust relationships that allow broad principals without both organization restriction and MFA.
match_type: CanAssume
require_org_id: true
require_mfa: true
require_specific_principal: true
severity: high
remediation_kind: restrict_assume_role
remediation_steps:
  - Add an aws:PrincipalOrgID condition that matches the owning organization.
  - Require aws:MultiFactorAuthPresent to be true.
  - Replace wildcard trust with the approved principal ARN.
